name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package mod
        run: |
          mkdir -p package/GameData/LifeSupportAlarms
          cp LifeSupportAlarms.dll package/GameData/LifeSupportAlarms/
          cp LifeSupportAlarms.version package/GameData/LifeSupportAlarms/
          cd package
          zip -r "../LifeSupportAlarms-${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LifeSupportAlarms-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
